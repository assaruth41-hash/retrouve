<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retrouvé – objets perdus et trouvés</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--ink:#0f2a43;--paper:#f3f5f7;--text:#12212f;--sun:#f5d547;--sky:#8fd3ff;--pink:#ff8fb1;--muted:#5b6b7a;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:#fff;font:400 16px/1.5 Figtree,system-ui,sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
main{position:relative;z-index:1}
h1,h2,h3{font-family:'Bricolage Grotesque',Georgia,serif;margin:0;line-height:1.02}
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:24px 20px 40px;max-width:760px}
.hero h1{font-weight:800;font-size:clamp(3rem,13vw,7rem);letter-spacing:-.03em}
.hero p{font-size:1.1rem;max-width:30ch;margin:16px 0 24px;color:#d6e6f5}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:14px 22px;font:600 1rem Figtree,sans-serif;cursor:pointer;background:var(--sun);color:var(--ink);text-decoration:none}
.btn.alt{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px #ffffff88}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.sheet{background:var(--paper);color:var(--text);border-radius:28px 28px 0 0;padding:32px 20px 48px;min-height:60vh}
.wrap{max-width:900px;margin:0 auto}
.sheet h2{font-size:clamp(1.8rem,6vw,2.6rem);margin-bottom:6px}
.sub{color:var(--muted);margin:0 0 22px}
.declare{background:#fff;border-radius:20px;padding:20px;margin-bottom:40px;box-shadow:0 0 0 1px #12212f14}
label{display:block;font-weight:600;margin:14px 0 6px}
input,textarea{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid #c5d0da;background:#fff;color:var(--text)}
.photo{display:flex;align-items:center;gap:14px}
.photo img{width:72px;height:72px;object-fit:cover;border-radius:14px;background:#e4ebf1}
.declare .btn{margin-top:20px;background:var(--ink);color:#fff}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px #12212f14;display:flex;flex-direction:column}
.thumb{aspect-ratio:4/3;background:var(--c,#8fd3ff);display:grid;place-items:center;font:800 3.5rem 'Bricolage Grotesque',serif;color:#0f2a4399}
.thumb img{width:100%;height:100%;object-fit:cover}
.card div.b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{font-size:1.25rem}
.card small{color:var(--muted)}
.card .btn{margin-top:auto;background:var(--ink);color:#fff;padding:11px 16px}
.empty{color:var(--muted)}
dialog{border:0;border-radius:24px;padding:0;width:min(440px,94vw);background:var(--paper);color:var(--text)}
dialog::backdrop{background:#0f2a43cc}
.ch{padding:16px 18px;background:var(--ink);color:#fff}
.ch b{font:800 1.2rem 'Bricolage Grotesque',serif}
.msgs{height:40vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:10px 14px;border-radius:16px;background:#fff}
.m.me{align-self:flex-end;background:var(--sky)}
.send{display:flex;gap:8px;padding:12px}
.note{font-size:.85rem;color:var(--muted);padding:0 16px 14px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<main>
<section class="hero">
  <h1>Tout ce qui se perd se retrouve.</h1>
  <p>Tu as trouvé un objet ? Publie-le. Tu en as perdu un ? Cherche-le et parle à celui qui l'a.</p>
  <div class="row"><a class="btn" href="#declarer">J'ai trouvé un objet</a><a class="btn alt" href="#liste">J'ai perdu un objet</a></div>
</section>
<section class="sheet">
<div class="wrap">
  <div class="declare" id="declarer">
    <h2>Publier un objet trouvé</h2>
    <p class="sub">Une photo et un lieu. Le reste se fait par message.</p>
    <label for="nom">Objet</label><input id="nom" placeholder="Clés avec porte-clé bleu">
    <label for="lieu">Lieu où tu l'as trouvé</label><input id="lieu" placeholder="Bibliothèque, 2e étage">
